apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: myapi-ingress
  namespace: myapi-prod

spec:
  ingressClassName: nginx

  rules:
    - host: myapi.com

      http:
        paths:
          - path: /
            pathType: Prefix

            backend:
              service:
                name: myapi-service

                port:
                  number: 80